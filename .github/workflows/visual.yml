name: Premium Glass - device screenshots
on:
  push:
    branches: [main, master]
    paths: ['app/**', 'docs/capture-premium-glass.sh', '.github/workflows/visual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    name: ${{ matrix.device }} device screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_4
          - device: tablet
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile the debug capture variant
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Enable hardware acceleration on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture phone, tablet and enlarged text on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: CAPTURE_DEVICE=${{ matrix.device }} bash docs/capture-premium-glass.sh
      - name: Upload actual APK screenshots and UI trees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Premium-Glass-${{ matrix.device }}-screenshots
          path: build/outputs/premium-glass
          if-no-files-found: error
