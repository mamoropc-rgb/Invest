name: Android - test, build, signed release
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      INVESTMENTS_STORE_PASSWORD: ${{ secrets.INVESTMENTS_STORE_PASSWORD }}
      INVESTMENTS_KEY_ALIAS: ${{ secrets.INVESTMENTS_KEY_ALIAS }}
      INVESTMENTS_KEY_PASSWORD: ${{ secrets.INVESTMENTS_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Tests, lint and debug APK
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Investments-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare private signing key
        if: ${{ github.event_name != 'pull_request' }}
        env:
          STORE_BASE64: ${{ secrets.INVESTMENTS_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$STORE_BASE64" || -z "$INVESTMENTS_STORE_PASSWORD" || -z "$INVESTMENTS_KEY_ALIAS" || -z "$INVESTMENTS_KEY_PASSWORD" ]]; then
            echo 'Signing secrets missing: release APK skipped'
            echo 'SIGN_READY=false' >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/invest-signing"
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/invest-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/invest-signing/release.jks"
          echo "INVESTMENTS_KEYSTORE_FILE=$RUNNER_TEMP/invest-signing/release.jks" >> "$GITHUB_ENV"
          echo 'SIGN_READY=true' >> "$GITHUB_ENV"
      - name: Signed release
        if: ${{ env.SIGN_READY == 'true' }}
        run: gradle --no-daemon --console=plain :app:assembleRelease
      - name: Upload signed release APK
        if: ${{ env.SIGN_READY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Investments-release-signed
          path: app/build/outputs/apk/release/app-release.apk
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/invest-signing"
