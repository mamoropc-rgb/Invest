name: Android - test, build, signed release
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: invest-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      INVESTMENTS_STORE_PASSWORD: ${{ secrets.INVESTMENTS_STORE_PASSWORD }}
      INVESTMENTS_KEY_ALIAS: ${{ secrets.INVESTMENTS_KEY_ALIAS }}
      INVESTMENTS_KEY_PASSWORD: ${{ secrets.INVESTMENTS_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Identify source revision
        run: |
          echo "Source commit: $GITHUB_SHA"
          grep -E 'versionCode =|versionName =' app/build.gradle.kts
      - name: Restore verified Robolectric SDK cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/invest-robolectric-sdk
          key: ${{ runner.os }}-invest-robolectric-4.14.1-api34-35-v1
      - name: Prepare verified SDKs with Maven backoff
        run: |
          python3 docs/prepare-robolectric.py --directory "$RUNNER_TEMP/invest-robolectric-sdk"
          echo "ROBOLECTRIC_SDK_DIR=$RUNNER_TEMP/invest-robolectric-sdk" >> "$GITHUB_ENV"
      - name: Verify additive upgrade policy
        run: python3 -m unittest discover -s docs -p test_upgrade_policy.py
      - name: Tests, lint and debug APK
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Investments-1.0.6-checks
          path: |
            app/build/reports/tests
            app/build/test-results
            app/build/reports/lint-results-debug.*
            ${{ runner.temp }}/invest-robolectric-sdk/sdk-cache-report.json
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Investments-1.0.6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare private signing key
        if: ${{ github.event_name != 'pull_request' }}
        env:
          STORE_BASE64: ${{ secrets.INVESTMENTS_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$STORE_BASE64" || -z "$INVESTMENTS_STORE_PASSWORD" || -z "$INVESTMENTS_KEY_ALIAS" || -z "$INVESTMENTS_KEY_PASSWORD" ]]; then
            echo 'Signing secrets missing: release APK skipped'
            echo 'SIGN_READY=false' >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/invest-signing"
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/invest-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/invest-signing/release.jks"
          echo "INVESTMENTS_KEYSTORE_FILE=$RUNNER_TEMP/invest-signing/release.jks" >> "$GITHUB_ENV"
          echo 'SIGN_READY=true' >> "$GITHUB_ENV"
      - name: Signed release
        if: ${{ env.SIGN_READY == 'true' }}
        run: gradle --no-daemon --console=plain :app:assembleRelease
      - name: Upload signed release APK
        if: ${{ env.SIGN_READY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Investments-1.0.6-release-signed
          path: app/build/outputs/apk/release/app-release.apk
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/invest-signing"
  upgrade:
    name: Verify signed update preserves data
    if: github.event_name != 'pull_request'
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - name: Download the current signed release
        uses: actions/download-artifact@v4
        with:
          pattern: Investments-*-release-signed
          merge-multiple: true
          path: upgrade/current
      - name: Download the unchanged 1.0.5 signed baseline
        uses: actions/download-artifact@v4
        with:
          name: Investments-1.0.5-release-signed
          run-id: 44928429958
          github-token: ${{ github.token }}
          path: upgrade/previous
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install 1.0.6 over 1.0.5 and compare all stored records
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: python3 docs/verify-upgrade.py --old-apk upgrade/previous/app-release.apk --new-apk upgrade/current/app-release.apk
      - name: Upload signed update verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Investments-1.0.6-upgrade-verification
          path: build/outputs/upgrade-check
          if-no-files-found: error
